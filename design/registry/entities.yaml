# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: skill_duration_ticks
    status: active
    source: design/gdd/character-combat-config.md
    referenced_by:
      - design/gdd/character-combat-config.md
      - design/gdd/game-concept.md
    variables:
      - duration_seconds
      - tick_rate
    output_range: [5, 600]
    expression: "ceil(duration_seconds * tick_rate)"
    notes: "Converts seconds in CharacterCombatConfigSO to 60Hz Photon Fusion 2 simulation ticks."
    added: 2026-11-10
    revised: ""

  - name: mobility_displacement
    status: active
    source: design/gdd/character-combat-config.md
    referenced_by:
      - design/gdd/character-combat-config.md
      - design/gdd/game-concept.md
    variables:
      - mobility_speed
      - mobility_duration
      - tick_rate
    output_range: [0.80, 18.0]
    expression: "mobility_speed * (ceil(mobility_duration * tick_rate) / tick_rate)"
    notes: "Forward Dash [2] = 4.00m (15 ticks); Side Dodge Roll [Q/E] = 2.80m (14 ticks)."
    added: 2026-11-10
    revised: ""

  - name: horizontal_turn_step_angle
    status: active
    source: design/gdd/character-combat-config.md
    referenced_by:
      - design/gdd/character-combat-config.md
      - design/gdd/game-concept.md
    variables:
      - turn_direction_sign
      - HorizontalSlashAngle
      - HorizontalTurnDuration
      - tick_rate
    output_range: [-25.0, 25.0]
    expression: "turn_direction_sign * (HorizontalSlashAngle / ceil(HorizontalTurnDuration * tick_rate))"
    notes: "Default 90 deg over 0.15s (9 ticks at 60Hz) = +/-10.0 deg/tick for both Character and Camera Yaw."
    added: 2026-11-10
    revised: ""

  - name: projectile_lifetime_seconds
    status: active
    source: design/gdd/character-combat-config.md
    referenced_by:
      - design/gdd/character-combat-config.md
      - design/gdd/game-concept.md
    variables:
      - ProjectileMaxDistance
      - ProjectileSpeed
    output_range: [0.20, 6.00]
    expression: "ProjectileMaxDistance / ProjectileSpeed"
    notes: "Default 26.0m / 22.0 m/s = 1.1818s (71 ticks at 60Hz) before returning to INetworkObjectProvider pool."
    added: 2026-11-10
    revised: ""

  - name: ranged_evasion_reaction_window
    status: active
    source: design/gdd/character-combat-config.md
    referenced_by:
      - design/gdd/character-combat-config.md
      - design/gdd/game-concept.md
    variables:
      - target_distance
      - ProjectileSpeed
      - network_rtt_ms
    output_range: [0.05, 2.50]
    expression: "(target_distance / ProjectileSpeed) - (network_rtt_ms / 2000.0)"
    notes: "Validates Pillar 1 evasion window (~0.57s at 13.2m with 60ms RTT)."
    added: 2026-11-10
    revised: ""

  - name: hits_to_kill
    status: active
    source: design/gdd/character-combat-config.md
    referenced_by:
      - design/gdd/character-combat-config.md
      - design/gdd/game-concept.md
    variables:
      - MaxHealth
      - attack_damage
    output_range: [1, 100]
    expression: "ceil(MaxHealth / attack_damage)"
    notes: "Vertical Slash = 3 hits (35 dmg); Horizontal Slash = 4 hits (25 dmg); Ranged Attack = 5 hits (20 dmg)."
    added: 2026-11-10
    revised: ""

  - name: theoretical_ttk
    status: active
    source: design/gdd/character-combat-config.md
    referenced_by:
      - design/gdd/character-combat-config.md
      - design/gdd/game-concept.md
    variables:
      - hits_to_kill
      - attack_cooldown
    output_range: [0.00, 60.0]
    expression: "(hits_to_kill - 1) * attack_cooldown"
    notes: "Vertical Slash TTK = 1.30s; Horizontal Slash TTK = 2.55s; Ranged Attack TTK = 2.20s."
    added: 2026-11-10
    revised: ""


