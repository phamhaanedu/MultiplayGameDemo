  - id: TR-rebind-001
    system: rebind
    gdd: design/gdd/keybinding-rebind-lobby-ui.md
    requirement: "LobbyFlowController must orchestrate Title/Login, Main Lobby, Room Waiting, and Settings Modal screens with reactive connection status and zero scene-reload overhead on modal transitions"
    created: 2026-11-10
    revised: ""
    status: active

  - id: TR-rebind-002
    system: rebind
    gdd: design/gdd/keybinding-rebind-lobby-ui.md
    requirement: "KeybindingRebindModal must support interactive key/mouse capture with a 5.0s timeout, Esc cancel, reserved key rejection, automatic swap-on-conflict with amber highlight (#F59E0B), and Reset to Defaults"
    created: 2026-11-10
    revised: ""
    status: active

  - id: TR-rebind-003
    system: rebind
    gdd: design/gdd/keybinding-rebind-lobby-ui.md
    requirement: "MobileActionPadVisibilityMode (Auto, AlwaysOn, Off) must persist in settings and immediately toggle the on-screen 7-button combat pad in both Lobby preview and Arena HUD"
    created: 2026-11-10
    revised: ""
    status: active

  # --- System #12: In-Game Public & Whisper Chat System ---
  - id: TR-chat-001
    system: chat
    gdd: design/gdd/in-game-chat-system.md
    requirement: "InGameChatController must keep its root GameObject active at all times and control panel visibility strictly via CanvasGroup (alpha, interactable, blocksRaycasts) so Photon Fusion RPCs never drop when the chat UI is faded"
    created: 2026-11-10
    revised: ""
    status: active

  - id: TR-chat-002
    system: chat
    gdd: design/gdd/in-game-chat-system.md
    requirement: "Chat parser must support Public messages and private Whisper commands (/w <TargetName> <Message> and Tab reply) routed via targeted Rpc_ReceiveChatMessage with rich-text sanitization and 160-character clamping"
    created: 2026-11-10
    revised: ""
    status: active

  - id: TR-chat-003
    system: chat
    gdd: design/gdd/in-game-chat-system.md
    requirement: "Chat rate limiter must enforce a 5-message token bucket (1 token/1.5s refill) and maintain a 50-row circular UI pool with 8.0s passive auto-fade to alpha 0.15"
    created: 2026-11-10
    revised: ""
    status: active

