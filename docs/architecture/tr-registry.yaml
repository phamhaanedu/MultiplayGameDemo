    requirement: "PlayFabAuthService must authenticate players via LoginWithCustomID or LoginWithEmailAddress, sync DisplayName (3..16 chars) to Photon Fusion [Networked] PlayerName, and fallback gracefully to Offline Guest Mode on network timeout"
