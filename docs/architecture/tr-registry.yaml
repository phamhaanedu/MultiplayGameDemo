    revised: ""
    status: active

  - id: TR-playfab-003
    system: playfab
    gdd: design/gdd/playfab-cloud-leaderboard.md
    requirement: "LeaderboardModalView must fetch Top 20 and AroundPlayer rankings via GetLeaderboard with a 15.0s client cache TTL and highlight the local player row in #38BDF8"
    created: 2026-11-10
    revised: ""
    status: active

  # --- System #14: 3D Spatial Audio & Combat VFX ---
  - id: TR-audio-001
    system: audio
    gdd: design/gdd/spatial-audio-combat-vfx.md
    requirement: "SoundManager must route audio through 4 AudioMixer groups (Master, BGM, SFX_3D, UI_2D) using 16 pooled 3D AudioSources (spatialBlend=1.0, minDistance=2.0m, maxDistance=28.0m) with +/-8% random pitch variation"
    created: 2026-11-10
    revised: ""
    status: active

  - id: TR-audio-002
    system: audio
    gdd: design/gdd/spatial-audio-combat-vfx.md
    requirement: "CombatVFXManager must render pooled URP particle and trail effects for Vertical Slash (#F59E0B), Horizontal Sweep (#38BDF8), Ranged Projectile/Impact (#FACC15), and Dash/Dodge trails with zero runtime shader compilation or GC allocation"
    created: 2026-11-10
    revised: ""
    status: active

  - id: TR-audio-003
    system: audio
    gdd: design/gdd/spatial-audio-combat-vfx.md
    requirement: "HitStop and HitFlash feedback must apply a 0.08s MPB _EmissionColor flash, DOTween squash-and-stretch (1.28, 0.72, 1.28), and bounded camera trauma shake without mutating shared materials or collider transforms"
