api_decisions:
  - purpose: melee_sector_hit_detection
    status: active
    api: "Physics.OverlapSphereNonAlloc + Vector3.Dot + Physics.Raycast(LineOfSightMask)"
    not: "Physics.OverlapSphere or animated weapon MeshCollider triggers"
    adr: docs/architecture/adr-0005-multidirectional-combat-and-lag-compensation.md
    reason: "Zero GC allocation on 60Hz network ticks and deterministic angular sector validation"
    referenced_by:
      - docs/architecture/adr-0001-immutable-combat-config-and-level-physics.md
      - docs/architecture/adr-0005-multidirectional-combat-and-lag-compensation.md
    added: 2026-11-10
    revised: ""

  - purpose: network_projectile_spawning
    status: active
    api: "FusionObjectPoolProvider : INetworkObjectProvider (Pre-warmed Queue of 32)"
    not: "UnityEngine.Object.Instantiate / Destroy or default NetworkObjectProviderDefault"
    adr: docs/architecture/adr-0003-photon-fusion-shared-mode-and-object-pooling.md
    reason: "Eliminates GC spikes and instantiation hitching during rapid ranged fire"
    referenced_by:
      - docs/architecture/adr-0003-photon-fusion-shared-mode-and-object-pooling.md
      - docs/architecture/adr-0005-multidirectional-combat-and-lag-compensation.md
    added: 2026-11-10
    revised: ""

  - purpose: hit_flash_shader_override
    status: active
    api: "Renderer.GetPropertyBlock / SetPropertyBlock (_EmissionColor)"
    not: "Renderer.material property access"
    adr: docs/architecture/adr-0008-playfab-cloud-leaderboard-and-spatial-vfx-pool.md
    reason: "Prevents runtime material instance duplication and preserves URP SRP Batcher compatibility"
    referenced_by:
      - docs/architecture/adr-0008-playfab-cloud-leaderboard-and-spatial-vfx-pool.md
    added: 2026-11-10
    revised: ""

forbidden_patterns:
  - pattern: direct_remote_health_mutation
    status: active
    description: "Attacker clients must never write directly to a remote player's [Networked] CurrentHP or IsAlive property; they must send Rpc_RequestTakeDamage to the victim's StateAuthority."
    why: "In Photon Fusion Shared Mode, only the StateAuthority owner can modify its [Networked] state without causing authority race conditions."
    adr: docs/architecture/adr-0004-tick-accurate-mobility-and-damage-rpc.md
    added: 2026-11-10

  - pattern: chat_gameobject_setactive_false
    status: active
    description: "InGameChatController must never call gameObject.SetActive(false) to hide the chat window; use CanvasGroup alpha, interactable, and blocksRaycasts instead."
    why: "Deactivating the GameObject disables its NetworkBehaviour and causes incoming Photon Fusion chat RPCs to be silently dropped."
    adr: docs/architecture/adr-0007-reactive-hud-mobile-pad-and-canvasgroup-chat.md
    added: 2026-11-10

  - pattern: hotpath_allocating_queries_in_fixedupdatenetwork
    status: active
    description: "Never call GetComponent, GameObject.Find, Physics.OverlapSphere, LINQ, or string '+' concatenation inside FixedUpdateNetwork() or Update()."
    why: "Causes managed heap allocations at 60Hz that trigger Garbage Collection frame stutters."
    adr: docs/architecture/adr-0001-immutable-combat-config-and-level-physics.md
    added: 2026-11-10
